# Model folders for the headless ComfyUI that start-all.ps1 runs.
# 1) Comfy Desktop's shared models (Z-Image-Turbo, MiniMax H3) on C:
comfy_desktop_shared:
  base_path: C:\Users\ryang\AppData\Local\Comfy-Desktop\ComfyUI-Shared\models
  is_default: true
  checkpoints: checkpoints/
  diffusion_models: diffusion_models/
  unet: unet/
  text_encoders: text_encoders/
  clip: clip/
  clip_vision: clip_vision/
  vae: vae/
  loras: loras/
  upscale_models: upscale_models/
  latent_upscale_models: latent_upscale_models/
  audio_encoders: audio_encoders/
  controlnet: controlnet/
  embeddings: embeddings/

# 2) Workstation video models (Wan 2.2, LTX-2.3) on D:
custom_ai_workstation:
  base_path: D:\CustomAI\models\comfy
  unet: unet/
  diffusion_models: unet/
  text_encoders: text_encoders/
  clip: text_encoders/
  vae: vae/
  loras: loras/
  latent_upscale_models: latent_upscale_models/
