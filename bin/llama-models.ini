version = 1

; {ROOT} is the workstation folder; start-all.ps1 writes the real paths to data\runtime\llama-models.ini.
; Models added from Prestige's catalog are appended with full paths.

; Shared by every model served by llama.cpp (router mode on port 8081).
[*]
n-gpu-layers = 99
flash-attn = on
jinja = true
parallel = 1

; Main agent: uncensored Qwen3.6 MoE. 25 of 40 expert layers sit in system RAM so it fits 12 GB.
[qwen3.6-35b-uncensored]
model = {ROOT}\models\gguf\qwen3.6-35b-a3b-heretic-Q4_K_M.gguf
mmproj = {ROOT}\models\gguf\qwen3.6-35b-a3b-heretic-mmproj.gguf
n-cpu-moe = 25
c = 32768

; Computer-use model for UI-TARS Desktop.
[ui-tars-1.5-7b]
model = {ROOT}\models\gguf\UI-TARS-1.5-7B-q5_k_m.gguf
mmproj = {ROOT}\models\gguf\UI-TARS-1.5-7B-f16.mmproj
c = 32768

